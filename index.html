.val small{color:var(--muted);font-size:12.5px}
.cline{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;align-items:center}
.wd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}

.ban button{min-height:44px;padding:0 12px;border:1px solid var(--fg);border-radius:6px;background:var(--bg);font-weight:700}

.sum{max-width:1000px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left));display:grid;gap:14px}

}

function render(){

/* 키보드 */
document.addEventListener("keydown",e=>{
if(e.ctrlKey||e.metaKey||e.altKey)return;
const t=e.target,tag=t&&t.tagName,k=e.key;
if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag))return;
if(dlg){if(k==="Escape"){closeDlg();e.preventDefault();return}
if(k==="Tab"&&dlg.trap){const f=[...dlg.trap.querySelectorAll("button,summary,[tabindex]")].filter(x=>!x.disabled&&!x.hidden);if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}}return}
if(dlg.key)dlg.key(e);if(k==="?")e.preventDefault();return}
if(k==="?"){openHelp();e.preventDefault();return}
const onBtn=/^(BUTTON|A|SUMMARY)$/.test(tag);
if((k==="Enter"||k===" ")&&onBtn)return;
const r=route();if(r.v!=="cut")return;
const id=r.id,it=BY[id],open=isOpen(id),idx=ORDER.indexOf(it);
if(!open&&(k==="1"||k==="2"||k==="3"||k==="4")){answer(id,k==="1"?"defect":k==="2"?"no_defect":k==="3"?"ambiguous":"skip");e.preventDefault();return}
if(k===" "){if(mainStage)mainStage.toggle();e.preventDefault();return}
if(k==="s"||k==="S"){cycleSpeed();return}
if(k==="ArrowLeft"){if(tag==="VIDEO")return;if(idx>0)goCut(ORDER[idx-1].id);e.preventDefault();return}
if(k==="ArrowRight"){if(tag==="VIDEO")return;if(open){fromSum=false;go(nextOf(id))}e.preventDefault();return}
if(k==="Enter"){if(open&&Date.now()-revealAt>400){fromSum=false;go(nextOf(id))}return}
if(k==="f"||k==="F"){if(mainStage)mainStage.openLb();return}
if((k==="c"||k==="C")&&!e.repeat){if(mainStage)mainStage.flick(true);return}
if(k==="l"||k==="L"){go("summary");return}
});
document.addEventListener("keyup",e=>{if((e.key==="c"||e.key==="C")&&mainStage)mainStage.flick(false)});
addEventListener("blur",()=>{if(mainStage)mainStage.flick(false)});
render();
